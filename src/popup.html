<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noir Shield</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup-body"><main class="popup-shell glass">
  <header class="popup-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 20 5v6c0 5.1-3.4 8.8-8 11-4.6-2.2-8-5.9-8-11V5l8-3Z" stroke="currentColor" stroke-width="1.7"/><path d="m8.5 12 2.3 2.3 4.8-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><strong>Noir Shield</strong><small id="domain">Site atual</small></div></div><button id="power" class="power" type="button" aria-label="Alternar proteção" title="Alternar proteção"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v10M5.6 5.7a9 9 0 1 0 12.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
  <section class="hero"><div class="orb" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M24 4 40 10v12c0 10.2-6.8 17.6-16 22C14.8 39.6 8 32.2 8 22V10L24 4Z" stroke="currentColor" stroke-width="1.5"/><path d="m17 23 5 5 10-11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="metric"><strong id="page-count">—</strong><span>bloqueios nesta página</span></div><div class="state-pill"><span class="status-dot"></span><span id="state-text">Verificando proteção</span></div><p id="counter-note" class="fineprint">Contagem de rede disponível em modo de depuração.</p></section>
  <section class="control"><div class="control-top"><span>Proteção do site</span><button id="site-toggle" class="mini-toggle" type="button" aria-label="Pausar proteção no site"><span></span></button></div><div class="level-row"><span>Nível</span><select id="level" aria-label="Nível de proteção"><option value="standard">Padrão</option><option value="aggressive">Agressivo</option></select></div><p class="hint" id="level-note">O nível agressivo pode interferir em alguns sites.</p></section>
  <section class="cards" aria-label="Recursos"><button id="ads-card" class="mini-card" type="button"><span class="card-icon">◫</span><strong>Anúncios</strong><small id="ads-count">— detectados</small></button><button id="trackers-card" class="mini-card" type="button"><span class="card-icon">◎</span><strong>Rastreadores</strong><small id="trackers-count">— detectados</small></button><button id="youtube-card" class="mini-card" type="button"><span class="card-icon">▷</span><strong>YouTube</strong><small id="youtube-state">Ativo</small></button><button id="filters-card" class="mini-card" type="button"><span class="card-icon">≡</span><strong>Filtros</strong><small id="filters-count">Listas ativas</small></button></section>
  <footer class="popup-footer"><div><span class="footer-led"></span><span id="engine-state">Motor DNR ativo</span></div><button id="pick" type="button">Bloquear elemento</button><button id="settings" type="button" aria-label="Abrir configurações" title="Configurações"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 17h16M9 4v6M15 14v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></footer>
  <div id="error" role="alert" class="toast" hidden></div>
</main><script src="popup.js"></script></body></html>
